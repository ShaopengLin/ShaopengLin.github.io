name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1,3,5" # Monday, Wednesday, Friday (UTC)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-citations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bin/requirements-citations.txt

      - name: Install citation dependencies
        run: python -m pip install -r bin/requirements-citations.txt

      - name: Test citation updater
        run: python -m unittest discover -s tests -p 'test_scholar_citations.py'

      - name: Run citation update script
        shell: bash
        run: |
          if timeout 90 python -u bin/update_scholar_citations.py; then
            echo "Citation fetch succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            echo "::error::Citation update failed (exit $status). See docs/citations.md for the local/browser fallback."
            echo "Citation update failed (exit $status). Existing data was preserved. See docs/citations.md." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Commit and push if changed
        id: commit
        run: |
          git add _data/citations.yml
          if git diff --staged --quiet; then
            echo "No citation changes." >> "$GITHUB_STEP_SUMMARY"
          else
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git commit -m "Update Google Scholar citations"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Updated _data/citations.yml and pushed the commit." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger the deploy workflow's push event.
      - name: Deploy updated citation badges
        if: steps.commit.outputs.changed == 'true' && (github.ref_name == 'main' || github.ref_name == 'master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
